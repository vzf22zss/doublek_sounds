[package]
name = "doublek-visuals"
version = "0.1.0"
edition = "2021"

[lib]
name = "doublek_lib"
path = "src/lib.rs"

[[bin]]
name = "doublek-visuals"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
rtrb = "0.3"
realfft = "3"
midir = "0.11.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
hound = "3"

[profile.dev.package."*"]
opt-level = 3
