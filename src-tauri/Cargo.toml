[package]
name = "doublek-visuals"
version = "0.1.0"
edition = "2021"

[lib]
name = "doublek_lib"
path = "src/lib.rs"

[[bin]]
name = "doublek-visuals"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
rtrb = "0.3"
realfft = "3"
midir = "0.11.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rubato = "5.0.1"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "flac", "wav", "pcm", "ogg", "vorbis"] }

# Spout (DK-102): a mesma versão que o Tauri já puxa (sem 2ª cópia no Cargo.lock), só com o necessário
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
hound = "3"

[profile.dev.package."*"]
opt-level = 3
